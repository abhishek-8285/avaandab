name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: |
          go mod download

      - name: Format check
        run: |
          if [ "$(gofmt -l -s .)" != "" ]; then
            echo "::error::Code is not formatted: $(gofmt -l -s .)"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Unit tests
        run: CGO_ENABLED=1 go test -v -race -count=1 ./...

      - name: Run tests with shuffle (isolation check)
        run: go test -shuffle=on -count=3 ./internal/... ./test/...

      - name: Audit shared state
        run: |
          ./scripts/audit-shared-state.sh > audit-results.txt
          TEST_VARS=$(sed -n '/--- Package-level vars in _test.go files ---/,/--- Global caches/p' audit-results.txt | grep -E '\.go:[0-9]+:var ' || true)
          if [ -n "$TEST_VARS" ]; then
            echo "::error::Package-level mutable state found in test files:"
            echo "$TEST_VARS"
            exit 1
          fi
          echo "✅ Shared state audit passed — zero package-level variables in test files."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Coverage Gate (80% minimum threshold)
        run: ./scripts/check-coverage.sh

      - name: SQLC generate check
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::sqlc generated files are out of date"
            git diff --exit-code
            exit 1
          fi

  security:
    name: Security Scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Run Security Scanners
        run: ./scripts/security-check.sh

  security-gates:
    name: Security Regression Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RAG routes must be registered inside the auth-protected group
        run: |
          # Vulnerable pattern: a TOP-LEVEL (column-0) ragHandler.RegisterRoutes call.
          # Inside the protected group it is indented. Fail if any column-0 call exists.
          if grep -n '^ragHandler.RegisterRoutes' cmd/server/main.go; then
            echo "::error::RAG routes registered at top level (unauthenticated) — must be inside the RequireAPIAuth-protected group"
            exit 1
          fi
          if ! grep -q '^[[:space:]].*ragHandler.RegisterRoutes' cmd/server/main.go; then
            echo "::error::No RAG route registration found inside the protected group"
            exit 1
          fi
          echo "RAG routes are registered inside the RequireAPIAuth-protected group."

      - name: RAG index endpoint enforces an allow-list
        run: |
          if ! grep -q 'allowedDirectory' internal/rag/handler.go; then
            echo "::error::handleIndex must enforce a directory allow-list (allowedDirectory)"
            exit 1
          fi
          echo "RAG directory indexing enforces an allow-list."

      - name: No hardcoded tenant literals
        run: |
          # Multi-tenancy (Spec 09 §2.4): handlers/middleware must derive the
          # tenant from context, never hardcode the literal "1". The single
          # controlled exception is shared.DefaultTenant (marked for removal
          # after migration 00056).
          if grep -rn 'TenantID:[[:space:]]*"1"' internal/ cmd/ --include='*.go'; then
            echo "::error::Hardcoded tenant literal found — use shared.TenantIDFromContext(ctx) or shared.DefaultTenant"
            exit 1
          fi
          echo "No hardcoded tenant literals. Tenant is always context-derived."

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mvtms:latest .
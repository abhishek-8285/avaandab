name: Mutation Testing (Nightly)

on:
  schedule:
    # Run at 02:00 UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      go_only:
        description: 'Run Go mutation tests only'
        required: false
        default: 'false'
      mobile_only:
        description: 'Run mobile mutation tests only'
        required: false
        default: 'false'

# No cancel-in-progress — mutation runs are expensive and long
concurrency:
  group: mutation-testing
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  go-mutation:
    name: Go Mutation Testing
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.mobile_only != 'true' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-mutesting
        run: |
          go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run Go mutation tests
        run: |
          chmod +x scripts/mutation-test.sh
          ./scripts/mutation-test.sh | tee mutation-go-report.txt
        env:
          CGO_ENABLED: 0

      - name: Upload Go mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-mutation-report
          path: mutation-go-report.txt
          retention-days: 30

  mobile-mutation:
    name: Mobile Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.go_only != 'true' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker mutation tests
        run: npm run mutation -- --reporters progress,html,json
        env:
          CI: true

      - name: Upload Stryker HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-mutation-report
          path: |
            mobile/reports/mutation/
          retention-days: 30

  mutation-summary:
    name: Mutation Testing Summary
    runs-on: ubuntu-latest
    needs: [go-mutation, mobile-mutation]
    if: always()
    steps:
      - name: Check mutation results
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go Mutation | ${{ needs.go-mutation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Mutation | ${{ needs.mobile-mutation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: mutation reports are available in the workflow run artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Fail if any mutation job failed
        if: needs.go-mutation.result == 'failure' || needs.mobile-mutation.result == 'failure'
        run: exit 1

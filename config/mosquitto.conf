# Mosquitto broker for GPS telemetry ingestion (Spec 01 §13.1)

# TCP listener — own GPS hardware devices
listener 1883
protocol mqtt

# WebSocket listener — mobile app (Spec 13)
listener 9001
protocol websockets

# Development: allow anonymous connections.
# Production hardening: set allow_anonymous false and configure ACL so each
# device may only publish to avandab/telemetry/devices/{own-imei}/gps.
allow_anonymous true

# Logging
log_dest stdout
log_type all

syntax = "proto3";

package dispatch;

option go_package = "internal/grpcservice/pb";

service DispatchService {
  rpc GetDriverLocation (LocationRequest) returns (LocationResponse);
  rpc UpdateTripStatus (TripStatusRequest) returns (TripStatusResponse);
}

message LocationRequest {
  string driver_id = 1;
}

message LocationResponse {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  string last_updated = 4;
}

message TripStatusRequest {
  string trip_id = 1;
  string status = 2;
}

message TripStatusResponse {
  bool success = 1;
  string message = 2;
}

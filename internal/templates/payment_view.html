<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-start mb-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Payment #{{.Payment.ID}}</h2>
            </div>
            <form method="POST" action="/payments/{{.Payment.ID}}/delete" class="inline">
                <button type="submit" class="px-3 py-1 min-h-[44px] flex items-center justify-center bg-red-600 text-white rounded-md hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 active:bg-red-700 text-sm">Delete</button>
            </form>
        </div>

        <dl class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
                <dt class="text-sm text-gray-500">Invoice</dt>
                <dd class="text-sm font-medium">{{.Payment.InvoiceNumber}}</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Amount</dt>
                <dd class="text-sm font-bold">{{printf "%.2f" .Payment.Amount}}</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Method</dt>
                <dd class="text-sm font-medium">{{.Payment.Method}}</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Payment Date</dt>
                <dd class="text-sm font-medium">{{datetime .Payment.PaymentDate}}</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Reference</dt>
                <dd class="text-sm font-medium">{{nullString .Payment.Reference}}</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Remarks</dt>
                <dd class="text-sm font-medium">{{nullString .Payment.Remarks}}</dd>
            </div>
        </dl>
    </div>
</div>

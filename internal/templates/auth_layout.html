<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{.Title}} - Avandab</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/material-icons.css?v={{if .Version}}{{.Version}}{{else}}20260812{{end}}">
    <link rel="stylesheet" href="/static/css/fonts.css?v={{if .Version}}{{.Version}}{{else}}20260812{{end}}">
    <link rel="stylesheet" href="/static/css/material-symbols.css?v={{if .Version}}{{.Version}}{{else}}20260812{{end}}">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
    <script src="/static/js/loader.js?v=20260818"></script>
    <script type="module" src="/static/js/datastar.js?v={{if .Version}}{{.Version}}{{else}}20260812{{end}}" defer></script>
    <link rel="stylesheet" href="/static/css/tailwind.css?v={{if .Version}}{{.Version}}{{else}}20260812{{end}}">
    <link rel="stylesheet" href="/static/css/app.css?v={{if .Version}}{{.Version}}{{else}}20260812{{end}}">


    <style>
        body {
            font-size: 1rem;
            line-height: 1.5;
            background-color: var(--color-background);
            color: var(--color-on-surface);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-display { font-family: 'Outfit', 'Satoshi', 'Plus Jakarta Sans', sans-serif; }

        /* Full Width Edge-to-Edge Navigation Bar */
        .header {
            background-color: var(--color-surface-container-lowest);
            border-bottom: 1px solid var(--color-border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
            width: 100%;
        }
        .navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 1.5rem;
            height: 80px;
        }
        @media (min-width: 768px) {
            .navigation {
                padding: 0 3rem;
            }
        }
        .navigation-button-container { display: none; }
        @media (max-width: 1023px) {
            .navigation-button-container { display: flex; }
        }
        .navigation-button {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* Far Left Logo */
        .navigation-main-logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .navigation-main-logo a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-color: var(--color-primary);
            color: var(--color-surface-container-lowest);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 4px rgba(0, 104, 95, 0.2);
            flex-shrink: 0;
        }

        /* Center Navigation Links */
        .navigation-body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        @media (max-width: 1023px) {
            .navigation-body { display: none; }
        }
        .navigation-body-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .navigation-top-menu {
            display: flex;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 0.5rem;
        }
        .navigation-top-menu-item {
            position: relative;
        }
        .navigation-top-menu-label,
        .navigation-top-menu-link {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-on-surface-variant);
            text-decoration: none;
            cursor: pointer;
            padding: 10px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s ease;
        }
        .navigation-top-menu-item:hover > .navigation-top-menu-label,
        .navigation-top-menu-item:hover > .navigation-top-menu-link {
            color: var(--color-primary);
        }
        .navigation-top-menu-label-arrow::after {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            border-right: 2px solid var(--color-text-muted);
            border-bottom: 2px solid var(--color-text-muted);
            transform: rotate(45deg);
            margin-top: -2px;
            transition: transform 0.2s ease;
        }
        .navigation-top-menu-item:hover > .navigation-top-menu-label-arrow::after {
            transform: rotate(225deg);
            border-color: var(--color-primary);
        }
        /* Dropdown Sublists */
        .navigation-top-menu-sublist {
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 220px;
            background-color: var(--color-surface-container-lowest);
            border: 1px solid var(--color-border-subtle);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border-radius: 6px;
            padding: 8px 0;
            list-style: none;
            display: none;
            z-index: 110;
        }
        .navigation-top-menu-item:hover > .navigation-top-menu-sublist {
            display: block;
        }
        .navigation-top-menu-sublist .navigation-top-menu-link {
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-on-surface-variant);
            width: 100%;
            display: block;
        }
        .navigation-top-menu-sublist .navigation-top-menu-link:hover {
            background-color: var(--color-surface-container-low);
            color: var(--color-primary);
        }

        /* Far Right Action Buttons */
        .navigation-top-menu-user-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            list-style: none;
            margin: 0;
            padding: 0;
            flex-shrink: 0;
        }
        .btn.black-border-button {
            border: 2px solid var(--color-on-surface);
            color: var(--color-on-surface);
            background-color: transparent;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn.black-border-button:hover {
            background-color: var(--color-on-surface);
            color: var(--color-surface-container-lowest);
        }
        .login-link-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.15s ease;
        }
        .login-link-button:hover {
            background-color: color-mix(in srgb, var(--color-primary) 10%, transparent);
        }

    </style>
    <script>
        document.documentElement.style.opacity = "1";
        document.addEventListener("DOMContentLoaded", function() {
            document.documentElement.style.opacity = "1";
        });
    </script>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-background font-sans antialiased min-h-screen flex flex-col">
    <div class="flex-1 w-full flex flex-col">
        {{.Content}}
    </div>

    {{if .FlashError}}
    <div class="fixed bottom-4 right-4 safe-bottom safe-right max-w-md w-full bg-status-alert/10 border-l-4 border-status-alert text-status-alert p-4 rounded shadow-lg flex items-start justify-between">
        <span class="flex-1">{{.FlashError}}</span>
        <button type="button" class="flash-dismiss ml-2 text-status-alert hover:text-status-alert focus:outline-none flex items-center justify-center" aria-label="Dismiss error">
            <span class="material-symbols-outlined text-sm">close</span>
        </button>
    </div>
    {{end}}

    <script>
        (function () {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var icon = btn.querySelector('[data-theme-icon]');
            function sync() {
                var dark = document.documentElement.classList.contains('dark');
                if (icon) icon.textContent = dark ? 'light_mode' : 'dark_mode';
                btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
            }
            btn.addEventListener('click', function () {
                var dark = document.documentElement.classList.toggle('dark');
                try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
                sync();
            });
            sync();
            try {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                var onChange = function (e) {
                    if (!localStorage.getItem('theme')) {
                        document.documentElement.classList.toggle('dark', e.matches);
                        sync();
                    }
                };
                if (mq.addEventListener) mq.addEventListener('change', onChange);
                else if (mq.addListener) mq.addListener(onChange);
            } catch (e) {}
        })();
    </script>

</body>
</html>

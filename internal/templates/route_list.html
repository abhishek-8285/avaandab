<div>
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Routes</h2>
        <a href="/routes/new"
            class="px-4 py-2 min-h-[44px] bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">New Route</a>
    </div>

    <form method="GET" action="/routes" class="mb-4 flex gap-2">
        <input type="text" name="q" value="{{.Query}}" placeholder="Search routes..."
            class="flex-1 text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <button type="submit" class="px-4 py-2 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Search</button>
    </form>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Source</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Destination</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Distance</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Est. Hours</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Fare</th>
                    <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Routes}}
                <tr>
                    <td class="px-4 py-2 text-sm">{{.Source}}</td>
                    <td class="px-4 py-2 text-sm">{{.Destination}}</td>
                    <td class="px-4 py-2 text-sm">{{.Distance}}</td>
                    <td class="px-4 py-2 text-sm">{{.EstimatedHours}}</td>
                    <td class="px-4 py-2 text-sm">{{printf "%.2f" .StandardFare}}</td>
                    <td class="px-4 py-2 text-right text-sm space-x-1">
                        <a href="/routes/{{.ID}}" class="text-blue-600 hover:text-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded">View</a>
                        <a href="/routes/{{.ID}}/edit" class="text-green-600 hover:text-green-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded">Edit</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

    {{if .Pagination.HasPrev}}
    <a href="/routes?page={{sub .Pagination.Page 1}}&q={{.Query}}"
        class="inline-block px-3 py-1 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Prev</a>
    {{end}}
    {{if .Pagination.HasNext}}
    <a href="/routes?page={{add .Pagination.Page 1}}&q={{.Query}}"
        class="inline-block px-3 py-1 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Next</a>
    {{end}}
</div>

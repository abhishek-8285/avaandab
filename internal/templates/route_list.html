<div>
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-900">Routes</h2>
        <a href="/routes/new"
            class="px-4 py-2 min-h-[44px] bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">New Route</a>
    </div>

    <form method="GET" action="/routes" class="mb-4 flex gap-2">
        <input type="text" name="q" value="{{.Query}}" placeholder="Search routes..."
            class="flex-1 text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <button type="submit" class="px-4 py-2 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Search</button>
    </form>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="th-cell">Source</th>
                    <th class="th-cell">Destination</th>
                    <th class="th-cell">Distance</th>
                    <th class="th-cell">Est. Hours</th>
                    <th class="th-cell">Fare</th>
                    <th class="th-cell-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Routes}}
                <tr>
                    <td class="td-cell">{{.Source}}</td>
                    <td class="td-cell">{{.Destination}}</td>
                    <td class="td-cell">{{.Distance}}</td>
                    <td class="td-cell">{{.EstimatedHours}}</td>
                    <td class="td-cell">{{printf "%.2f" .StandardFare}}</td>
                    <td class="td-cell-actions">
                        <a href="/routes/{{.ID}}" class="action-view">View</a>
                        <a href="/routes/{{.ID}}/edit" class="action-edit">Edit</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

    {{template "pagination.html" .}}
</div>

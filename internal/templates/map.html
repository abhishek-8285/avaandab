<div class="space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b pb-4">
        <div>
            <h1 class="text-2xl font-bold text-on-surface tracking-tight">Live Fleet Map</h1>
            <p class="text-sm text-secondary mt-1">Real-time GPS telemetry, active positions, and vehicle tracking</p>
        </div>
        <div class="flex flex-wrap items-center gap-3 text-xs font-medium">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block bg-status-success"></span>Running</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block bg-primary"></span>Stopped</span>

        </div>
    </div>

    <div id="map" class="h-[75vh] w-full rounded-xl border border-border-subtle overflow-hidden shadow-sm bg-surface-container-low"></div>
</div>

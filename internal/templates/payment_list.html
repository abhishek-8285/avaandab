<div>
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-900">Payments</h2>
    </div>

    <form method="GET" action="/payments" class="mb-4 flex gap-2">
        <input type="text" name="q" placeholder="Search payments..."
            class="flex-1 text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <select name="method" class="text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <option value="">All Methods</option>
            <option value="cash" {{if eq .Method "cash"}}selected{{end}}>Cash</option>
            <option value="upi" {{if eq .Method "upi"}}selected{{end}}>UPI</option>
            <option value="bank_transfer" {{if eq .Method "bank_transfer"}}selected{{end}}>Bank Transfer</option>
            <option value="cheque" {{if eq .Method "cheque"}}selected{{end}}>Cheque</option>
        </select>
        <button type="submit" class="px-4 py-2 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Filter</button>
    </form>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="th-cell">Invoice</th>
                    <th class="th-cell">Date</th>
                    <th class="th-cell">Amount</th>
                    <th class="th-cell">Method</th>
                    <th class="th-cell">Reference</th>
                    <th class="th-cell-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Payments}}
                <tr>
                    <td class="td-cell">{{.InvoiceNumber}}</td>
                    <td class="td-cell">{{datetime .PaymentDate}}</td>
                    <td class="td-cell">{{printf "%.2f" .Amount}}</td>
                    <td class="td-cell">{{.Method}}</td>
                    <td class="td-cell">{{nullString .Reference}}</td>
                    <td class="td-cell-actions">
                        <a href="/payments/{{.ID}}" class="action-view">View</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

    {{template "pagination.html" .}}
</div>

{{template "page_header.html" (dict "Title" "Payments" "Subtitle" "View recorded invoice payments and transaction receipts")}}
{{template "kpi_grid.html" .}}

<div class="bg-surface-container-lowest border border-border-subtle rounded shadow-sm flex flex-col h-full overflow-hidden">
    <!-- Sticky Filter Bar (Stitch Design) -->
    <form method="GET" action="/payments" class="px-4 py-2 border-b border-border-subtle flex flex-wrap items-center gap-2 bg-surface-container-lowest sticky top-0 z-10">
        <span class="text-xs font-medium text-secondary mr-2">{{t "common.filters"}}</span>
        <a href="/payments" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .Method ""}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm">All Payments</a>
        <a href="/payments?method=upi" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .Method "upi"}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm">UPI</a>
        <a href="/payments?method=bank_transfer" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .Method "bank_transfer"}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm">Bank Transfer</a>
        <a href="/payments?method=cash" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .Method "cash"}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm">Cash</a>

        <div class="ml-auto flex items-center gap-2 flex-wrap">
            <div class="relative min-w-[200px] flex-1 sm:flex-none">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted pointer-events-none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </span>
                <input type="text" name="q" value="{{.Query}}" placeholder='{{t "common.search"}}'
                    class="bg-surface-container-low border border-border-subtle rounded-md py-2 pl-9 pr-4 text-sm text-on-surface w-full focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
            </div>
            <button type="submit" class="inline-flex items-center gap-2 rounded-md bg-primary text-on-primary px-4 py-2 text-sm font-medium hover:bg-primary/90 transition-all cursor-pointer">
                Search
            </button>
        </div>
    </form>

    <!-- Data Table Fragment (Datastar refresh target) -->
    <div id="list-table">
        {{template "payment_list_table.html" .}}
    </div>
</div>

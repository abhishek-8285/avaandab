<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4 py-12">
    <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-4 shadow-inner">
        <span class="material-icons text-3xl">error_outline</span>
    </div>
    
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">
        {{if .StatusCode}}{{.StatusCode}} - {{end}}{{.Title}}
    </h2>
    
    <p class="text-gray-600 max-w-md mb-8 text-base">
        {{if .Message}}
            {{.Message}}
        {{else}}
            We encountered an unexpected error while processing your request.
        {{end}}
    </p>
    
    <div class="flex flex-wrap items-center justify-center gap-3">
        <a href="javascript:history.back()" 
           class="px-4 py-2 min-h-[44px] inline-flex items-center justify-center bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 font-medium focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition-colors">
            <span class="material-icons mr-1 text-sm">arrow_back</span>
            Go Back
        </a>
        <a href="/dashboard" 
           class="px-4 py-2 min-h-[44px] inline-flex items-center justify-center bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-medium focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 shadow-sm transition-colors">
            <span class="material-icons mr-1 text-sm">dashboard</span>
            Return to Dashboard
        </a>
    </div>
</div>

<div class="max-w-xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-on-surface">Record Maintenance Work</h1>
        <p class="text-secondary text-sm">Log completed servicing, update vehicle maintenance history, and clear due blockers.</p>
    </div>

    <form method="POST" action="/maintenance/records" class="bg-surface-container-lowest p-6 rounded-xl border border-border-subtle shadow-sm space-y-4">
        <div>
            <label class="block text-sm font-medium text-on-surface mb-1">Vehicle ID *</label>
            <input type="text" name="vehicle_id" value="{{.VehicleID}}" required placeholder="e.g. veh-123"
                   class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
        </div>

        <div>
            <label class="block text-sm font-medium text-on-surface mb-1">Service Type *</label>
            <select name="service_type" required class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                {{range .ServiceTypes}}
                <option value="{{.}}">{{.}}</option>
                {{end}}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Date Performed *</label>
                <input type="date" name="performed_at" required
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Odometer (km)</label>
                <input type="number" step="any" name="odometer_km" placeholder="e.g. 45200"
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Cost (₹)</label>
                <input type="number" step="any" name="cost" placeholder="e.g. 3500"
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Vendor / Workshop</label>
                <input type="text" name="vendor" placeholder="e.g. Tata Authorized Service"
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-on-surface mb-1">Notes / Description</label>
            <textarea name="notes" rows="3" placeholder="Details of parts replaced, oil grade, warranty notes..."
                      class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-border-subtle">
            <a href="/maintenance" class="px-4 py-2 text-sm text-secondary hover:text-on-surface transition-colors">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-primary text-on-primary rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors shadow-sm">Record Maintenance Work</button>
        </div>
    </form>
</div>

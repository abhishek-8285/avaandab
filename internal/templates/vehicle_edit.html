<div class="max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold mb-4 text-gray-900">{{if .Vehicle}}Edit Vehicle{{else}}New Vehicle{{end}}</h2>

    {{if .FlashError}}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">{{.FlashError}}</div>
    {{end}}

    {{ $vehicle := .Vehicle }}

    <form method="POST" action="/vehicles{{if $vehicle}}/{{$vehicle.ID}}/edit{{else}}/new{{end}}" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Registration Number *</label>
                <input type="text" name="registration_number" value="{{if $vehicle}}{{$vehicle.RegistrationNumber}}{{end}}" required
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Vehicle Number *</label>
                <input type="text" name="vehicle_number" value="{{if $vehicle}}{{$vehicle.VehicleNumber}}{{end}}" required
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Vehicle Type</label>
                <select name="vehicle_type" class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    <option value="truck" {{if eq $vehicle.VehicleType "truck"}}selected{{end}}>Truck</option>
                    <option value="mini_truck" {{if eq $vehicle.VehicleType "mini_truck"}}selected{{end}}>Mini Truck</option>
                    <option value="bus" {{if eq $vehicle.VehicleType "bus"}}selected{{end}}>Bus</option>
                    <option value="van" {{if eq $vehicle.VehicleType "van"}}selected{{end}}>Van</option>
                    <option value="pickup" {{if eq $vehicle.VehicleType "pickup"}}selected{{end}}>Pickup</option>
                    <option value="tempo" {{if eq $vehicle.VehicleType "tempo"}}selected{{end}}>Tempo</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Capacity (seats/kg)</label>
                <input type="number" name="capacity" value="{{if $vehicle}}{{$vehicle.Capacity}}{{end}}"
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols">
            <div>
                <label class="block text-sm font-medium text-gray-700">Fuel Type</label>
                <select name="fuel_type" class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    <option value="diesel" {{if eq $vehicle.FuelType "diesel"}}selected{{end}}>Diesel</option>
                    <option value="petrol" {{if eq $vehicle.FuelType "petrol"}}selected{{end}}>Petrol</option>
                    <option value="gas" {{if eq $vehicle.FuelType "gas"}}selected{{end}}>Gas</option>
                    <option value="electric" {{if eq $vehicle.FuelType "electric"}}selected{{end}}>Electric</option>
                    <option value="cng" {{if eq $vehicle.FuelType "cng"}}selected{{end}}>CNG</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Insurance Expiry *</label>
                <input type="date" name="insurance_expiry" value="{{if $vehicle}}{{date_only $vehicle.InsuranceExpiry}}{{end}}" required
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Fitness Expiry *</label>
                <input type="date" name="fitness_expiry" value="{{if $vehicle}}{{date_only $vehicle.FitnessExpiry}}{{end}}" required
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Permit Expiry *</label>
                <input type="date" name="permit_expiry" value="{{if $vehicle}}{{date_only $vehicle.PermitExpiry}}{{end}}" required
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Current Mileage (km)</label>
                <input type="number" step="0.1" name="current_mileage" value="{{if $vehicle}}{{if $vehicle.CurrentMileage}}{{$vehicle.CurrentMileage}}{{end}}{{end}}"
                class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Status</label>
            <select name="status" class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                <option value="available" {{if eq $vehicle.Status "available"}}selected{{end}}>Available</option>
                <option value="running" {{if eq $vehicle.Status "running"}}selected{{end}}>Running</option>
                <option value="maintenance" {{if eq $vehicle.Status "maintenance"}}selected{{end}}>Maintenance</option>
                <option value="inactive" {{if eq $vehicle.Status "inactive"}}selected{{end}}>Inactive</option>
            </select>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a href="/vehicles" class="px-4 py-2 min-h-[44px] flex items-center justify-center border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-100">Cancel</a>
            <button type="submit" class="px-4 py-2 min-h-[44px] bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">Save Vehicle</button>
        </div>
    </form>
</div>

<div id="register-container" class="w-full max-w-md">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 auth-enter">
        <div class="p-6 sm:p-8">
            <div class="text-center">
                <h2 class="text-2xl font-extrabold text-slate-900">Create an Account</h2>
                <p class="mt-2 text-sm text-slate-600">Get started with Avandab</p>
            </div>

            {{if .Error}}
            <div class="mt-5 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md text-sm auth-error">
                {{.Error}}
            </div>
            {{end}}

            <form class="mt-5 sm:mt-6 space-y-4" method="POST" action="/register" data-on-submit="@post('/register', {contentType: 'form'})">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Name *</label>
                    <input type="text" name="name" required value="{{.Name}}" placeholder="e.g. John Doe"
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 auth-input">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address *</label>
                    <input type="email" name="email" required value="{{.Email}}" placeholder="name@company.com"
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 auth-input">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" name="phone" value="{{.Phone}}" placeholder="+1-555-0199"
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 auth-input">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password *</label>
                    <input type="password" name="password" required minlength="6"
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 auth-input">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password *</label>
                    <input type="password" name="confirm_password" required minlength="6"
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 auth-input">
                </div>

                <button type="submit"
                    class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 auth-btn min-h-[44px] disabled:opacity-75">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-600">
                Already have an account?
                <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">Sign in</a>
            </div>
        </div>
    </div>
</div>

<div class="flex-1 flex items-center justify-center p-4 min-h-[calc(100vh-2rem)]">
    <main class="w-full max-w-[480px] bg-white border border-slate-200 rounded-xl shadow-xs flex flex-col p-6 sm:p-8 gap-6 relative overflow-hidden my-8">
        <!-- Decorative Header Line -->
        <div class="absolute top-0 left-0 w-full h-[4px] bg-[#00685f]"></div>

        <!-- Top Action Bar -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <a href="/" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-[#00685f] transition-colors">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                <span>Back to Home</span>
            </a>
        </div>

        <!-- Header -->
        <header class="flex flex-col gap-1 text-center items-center">
            <a href="/" class="inline-flex items-center gap-2.5 no-underline">
                <div class="w-10 h-10 rounded-lg bg-[#00685f] text-white flex items-center justify-center shadow-sm shrink-0">
                    <span class="material-symbols-outlined text-2xl">local_shipping</span>
                </div>
                <span class="text-2xl font-black text-[#00685f] font-display tracking-tight">Avandab</span>
            </a>
            <p class="text-xs text-slate-500 font-medium mt-1">Create your logistics management account.</p>
        </header>

        {{if .Error}}
        <div class="p-3.5 bg-red-50 border border-red-200 text-red-700 rounded-md text-xs flex items-center gap-2">
            <span class="material-symbols-outlined text-base shrink-0">error</span>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <!-- Form -->
        <form action="/register" class="flex flex-col gap-4" method="POST">
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider" for="name">Full Name *</label>
                    <input class="h-[40px] px-3 py-2 border border-slate-300 bg-slate-50 rounded-md text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 outline-none transition-all" id="name" name="name" value="{{.Name}}" placeholder="Jane Doe" required type="text"/>
                </div>
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider" for="phone">Phone Number</label>
                    <input class="h-[40px] px-3 py-2 border border-slate-300 bg-slate-50 rounded-md text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 outline-none transition-all" id="phone" name="phone" value="{{.Phone}}" placeholder="+91 8285336507" type="tel"/>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider" for="email">Work Email *</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">mail</span>
                    <input class="w-full h-[40px] pl-10 pr-3 py-2 border border-slate-300 bg-slate-50 rounded-md text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 outline-none transition-all" id="email" name="email" value="{{.Email}}" placeholder="jane.doe@company.com" required type="email"/>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider" for="password">Password *</label>
                    <input class="h-[40px] px-3 py-2 border border-slate-300 bg-slate-50 rounded-md text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 outline-none transition-all" id="password" name="password" placeholder="••••••••" required type="password"/>
                </div>
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider" for="confirm_password">Confirm Password *</label>
                    <input class="h-[40px] px-3 py-2 border border-slate-300 bg-slate-50 rounded-md text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 outline-none transition-all" id="confirm_password" name="confirm_password" placeholder="••••••••" required type="password"/>
                </div>
            </div>

            <div class="pt-2">
                <button class="bg-[#00685f] hover:bg-[#005049] text-white font-bold text-xs uppercase tracking-wider px-6 py-3 w-full inline-flex justify-center items-center gap-2 rounded-md transition-colors shadow-xs cursor-pointer" type="submit">
                    <span class="material-symbols-outlined text-base">how_to_reg</span>
                    <span>Register Operator Account</span>
                </button>
            </div>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                Already registered?
                <a href="/login" class="text-[#00685f] font-bold hover:underline ml-1">Sign In</a>
            </p>
        </div>
    </main>
</div>

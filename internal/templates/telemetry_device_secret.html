<div class="max-w-2xl mx-auto bg-surface-container-lowest border border-border-subtle rounded-lg shadow-sm">
    <div class="px-6 py-4 border-b border-border-subtle flex items-center gap-2 text-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3z"/></svg>
        <h3 class="text-base font-semibold text-on-surface font-display">Device Secret Provisioned</h3>
    </div>
    <div class="p-6 sm:p-8">
        <p class="text-sm text-text-muted mb-4 leading-relaxed">
            Device <span class="font-mono text-primary">{{if .Device}}{{.Device.IMEI}}{{else}}unknown{{end}}</span> is now <strong>active</strong>.
            Flash the secret below to the hardware. It is shown <strong>once</strong> and never stored in plaintext.
        </p>
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
            <code id="device-secret" class="flex-1 bg-surface-container-low border border-border-subtle rounded-md p-3 font-mono text-xs text-on-surface break-all">{{.RawSecret}}</code>
            <button type="button" class="inline-flex items-center justify-center gap-2 rounded-md bg-primary text-on-primary px-4 py-2 text-sm font-medium hover:bg-primary/90 transition-all shrink-0"
                onclick="navigator.clipboard.writeText(document.getElementById('device-secret').textContent)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                Copy
            </button>
        </div>
        <div class="mt-6 pt-4 border-t border-border-subtle">
            <a href="/telemetry/devices" class="inline-flex items-center gap-1 text-sm text-primary hover:underline font-medium">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Back to devices
            </a>
        </div>
    </div>
</div>

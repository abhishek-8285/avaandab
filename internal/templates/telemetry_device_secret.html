<div class="max-w-2xl mx-auto bg-surface-container-lowest border border-border-subtle rounded shadow-sm">
    <div class="px-6 py-4 border-b border-border-subtle flex items-center gap-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3z"/></svg>
        <h3 class="text-base font-semibold text-on-surface font-display">Device Secret Provisioned</h3>
    </div>
    <div class="p-6">
        <p class="text-sm text-secondary mb-3">
            Device <span class="font-mono text-primary">{{if .Device}}{{.Device.IMEI}}{{else}}unknown{{end}}</span> is now <strong>active</strong>.
            Flash the secret below to the hardware. It is shown <strong>once</strong> and never stored in plaintext.
        </p>
        <div class="flex items-center gap-3">
            <code id="device-secret" class="flex-1 bg-surface-container-low border border-border-subtle rounded-md p-3 font-mono text-xs text-on-surface break-all">{{.RawSecret}}</code>
            <button type="button" class="text-primary hover:underline font-medium text-sm"
                onclick="navigator.clipboard.writeText(document.getElementById('device-secret').textContent)">Copy</button>
        </div>
        <div class="mt-4">
            <a href="/telemetry/devices" class="text-sm text-primary hover:underline">Back to devices</a>
        </div>
    </div>
</div>

<div>
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Drivers</h2>
        <a href="/drivers/new" class="px-4 py-2 min-h-[44px] bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">New Driver</a>
    </div>

    <form method="GET" action="/drivers" class="mb-4 flex gap-2">
        <input type="text" name="q" value="{{.Query}}" placeholder="Search drivers..."
            class="flex-1 text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <select name="status" class="text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <option value="">All Status</option>
            <option value="available" {{if eq .StatusFilter "available"}}selected{{end}}>Available</option>
            <option value="on_trip" {{if eq .StatusFilter "on_trip"}}selected{{end}}>On Trip</option>
            <option value="leave" {{if eq .StatusFilter "leave"}}selected{{end}}>Leave</option>
            <option value="inactive" {{if eq .StatusFilter "inactive"}}selected{{end}}>Inactive</option>
        </select>
        <button type="submit" class="px-4 py-2 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Filter</button>
    </form>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Driver ID</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Phone</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">License</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Drivers}}
                <tr>
                    <td class="px-4 py-2 text-sm">{{.DriverID}}</td>
                    <td class="px-4 py-2 text-sm">{{.FirstName}} {{.LastName}}</td>
                    <td class="px-4 py-2 text-sm">{{.Phone}}</td>
                    <td class="px-4 py-2 text-sm">{{.LicenseNumber}}</td>
                    <td class="px-4 py-2 text-sm">
                        <span class="px-2 py-1 text-xs rounded-full {{statusBadge .Status}}">{{.Status}}</span>
                    </td>
                    <td class="px-4 py-2 text-right text-sm space-x-1">
                        <a href="/drivers/{{.ID}}" class="text-blue-600 hover:text-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded">View</a>
                        <a href="/drivers/{{.ID}}/edit" class="text-green-600 hover:text-green-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 rounded">Edit</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

    {{if .Pagination.HasPrev}}
    <a href="/drivers?page={{sub .Pagination.Page 1}}&q={{.Query}}"
        class="inline-block px-3 py-1 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Prev</a>
    {{end}}
    {{if .Pagination.HasNext}}
    <a href="/drivers?page={{add .Pagination.Page 1}}&q={{.Query}}"
        class="inline-block px-3 py-1 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Next</a>
    {{end}}
</div>

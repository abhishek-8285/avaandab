<div class="max-w-2xl mx-auto">
    <h2 class="text-xl font-semibold mb-4">{{if .Customer}}Edit Customer{{else}}New Customer{{end}}</h2>

    {{if .FlashError}}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">{{.FlashError}}</div>
    {{end}}

    <form method="POST" action="/customers{{if .Customer}}/{{.Customer.ID}}/edit{{else}}/new{{end}}" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name *</label>
                <input type="text" name="name" value="{{if .Customer}}{{.Customer.Name}}{{end}}" required
                    class="mt-1 block w-full text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Company</label>
                <input type="text" name="company" value="{{if .Customer}}{{nullString .Customer.Company}}{{end}}"
                    class="mt-1 block w-full text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Phone *</label>
            <input type="tel" name="phone" value="{{if .Customer}}{{.Customer.Phone}}{{end}}" required
                class="mt-1 block w-full text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" name="email" value="{{if .Customer}}{{nullString .Customer.Email}}{{end}}"
                class="mt-1 block w-full text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">GST</label>
            <input type="text" name="gst" value="{{if .Customer}}{{nullString .Customer.GST}}{{end}}"
                class="mt-1 block w-full text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Address</label>
            <textarea name="address" rows="2"
                class="mt-1 block w-full text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">{{if .Customer}}{{nullString .Customer.Address}}{{end}}</textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a href="/customers" class="px-4 py-2 min-h-[44px] flex items-center justify-center border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-100>Cancel</a>
            <button type="submit" class="px-4 py-2 min-h-[44px] bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">Save Customer</button>
        </div>
    </form>
</div>

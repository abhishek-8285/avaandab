<div class="max-w-xl mx-auto py-2">
    <div class="bg-white border border-[#EAE8E4] rounded shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-[#EAE8E4] flex justify-between items-center bg-[#f8fafc]">
            <h2 class="text-base font-bold text-[#191c1e] font-display flex items-center gap-2">
                <span class="material-symbols-outlined text-[#00685f]">person</span>
                {{if .Customer}}Edit Customer{{else}}New Customer{{end}}
            </h2>
            <a href="/customers" class="text-xs text-[#565e74] hover:text-[#191c1e] transition-colors">Back to list</a>
        </div>

        {{if .FlashError}}
        <div class="mx-6 mt-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-md">{{.FlashError}}</div>
        {{end}}

        <form method="POST" action="/customers{{if .Customer}}/{{.Customer.ID}}/edit{{else}}/new{{end}}" class="p-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-[#565e74] mb-1">Full Name *</label>
                    <input type="text" name="name" value="{{if .Customer}}{{.Customer.Name}}{{end}}" required
                        class="w-full text-xs bg-white border border-[#EAE8E4] rounded px-3 py-2 focus:outline-none focus:border-[#00685f] focus:ring-1 focus:ring-[#00685f]/20 transition-all text-[#191c1e] placeholder-gray-400"
                        placeholder="e.g. Acme Corp / Rajesh Kumar">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#565e74] mb-1">Company / Organization</label>
                    <input type="text" name="company" value="{{if .Customer}}{{nullString .Customer.Company}}{{end}}"
                        class="w-full text-xs bg-white border border-[#EAE8E4] rounded px-3 py-2 focus:outline-none focus:border-[#00685f] focus:ring-1 focus:ring-[#00685f]/20 transition-all text-[#191c1e] placeholder-gray-400"
                        placeholder="Company name">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-[#565e74] mb-1">Phone Number *</label>
                    <input type="tel" name="phone" value="{{if .Customer}}{{.Customer.Phone}}{{end}}" required
                        class="w-full text-xs bg-white border border-[#EAE8E4] rounded px-3 py-2 focus:outline-none focus:border-[#00685f] focus:ring-1 focus:ring-[#00685f]/20 transition-all text-[#191c1e] font-mono placeholder-gray-400"
                        placeholder="+91 98765 43210">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#565e74] mb-1">Email Address</label>
                    <input type="email" name="email" value="{{if .Customer}}{{nullString .Customer.Email}}{{end}}"
                        class="w-full text-xs bg-white border border-[#EAE8E4] rounded px-3 py-2 focus:outline-none focus:border-[#00685f] focus:ring-1 focus:ring-[#00685f]/20 transition-all text-[#191c1e] placeholder-gray-400"
                        placeholder="billing@company.com">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-[#565e74] mb-1">GST Number</label>
                <input type="text" name="gst" value="{{if .Customer}}{{nullString .Customer.GST}}{{end}}"
                    class="w-full text-xs bg-white border border-[#EAE8E4] rounded px-3 py-2 focus:outline-none focus:border-[#00685f] focus:ring-1 focus:ring-[#00685f]/20 transition-all text-[#191c1e] font-mono uppercase placeholder-gray-400"
                    placeholder="07AAAAA0000A1Z5">
            </div>

            <div>
                <label class="block text-xs font-semibold text-[#565e74] mb-1">Billing / Delivery Address</label>
                <textarea name="address" rows="2"
                    class="w-full text-xs bg-white border border-[#EAE8E4] rounded px-3 py-2 focus:outline-none focus:border-[#00685f] focus:ring-1 focus:ring-[#00685f]/20 transition-all text-[#191c1e] placeholder-gray-400"
                    placeholder="Full street address...">{{if .Customer}}{{nullString .Customer.Address}}{{end}}</textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-3 border-t border-[#EAE8E4]">
                <a href="/customers" class="px-4 py-1.5 rounded border border-[#EAE8E4] text-xs font-medium text-[#565e74] hover:bg-slate-50 transition-colors text-decoration-none">Cancel</a>
                <button type="submit" class="px-4 py-1.5 rounded bg-[#00685f] text-white text-xs font-medium hover:bg-[#005049] transition-colors border-0 cursor-pointer shadow-xs">Save Customer</button>
            </div>
        </form>
    </div>
</div>

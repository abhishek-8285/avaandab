<div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-900">{{if .Booking}}Edit Booking{{else}}New Booking{{end}}</h2>

    {{if .FlashError}}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">{{.FlashError}}</div>
    {{end}}

    {{ $b := .Booking }}

    <form method="POST" action="/bookings{{if $b}}/{{$b.ID}}/edit{{else}}/new{{end}}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Customer *</label>
            <select name="customer_id" required class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                <option value="">Select Customer</option>
                {{range .Customers}}
                <option value="{{.ID}}" {{if and $b (eq .ID $b.CustomerID)}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Route *</label>
            <select name="route_id" required class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                <option value="">Select Route</option>
                {{range .Routes}}
                <option value="{{.ID}}" {{if and $b (eq .ID $b.RouteID)}}selected{{end}}>{{.Source}} → {{.Destination}}</option>
                {{end}}
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Pickup Date *</label>
                <input type="date" name="pickup_date" value="{{if $b}}{{date_only $b.PickupDate}}{{end}}" required
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Vehicle Type</label>
                <select name="vehicle_type" class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                    <option value="truck" {{if eq $b.VehicleType "truck"}}selected{{end}}>Truck</option>
                    <option value="mini_truck" {{if eq $b.VehicleType "mini_truck"}}selected{{end}}>Mini Truck</option>
                    <option value="van" {{if eq $b.VehicleType "van"}}selected{{end}}>Van</option>
                    <option value="pickup" {{if eq $b.VehicleType "pickup"}}selected{{end}}>Pickup</option>
                    <option value="tempo" {{if eq $b.VehicleType "tempo"}}selected{{end}}>Tempo</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Passengers</label>
                <input type="number" name="passengers" value="{{if $b}}{{$b.Passengers}}{{end}}"
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Cargo Weight (kg)</label>
                <input type="number" step="0.1" name="cargo_weight" value="{{if $b}}{{if $b.CargoWeight}}{{$b.CargoWeight}}{{end}}{{end}}"
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Price</label>
                <input type="number" step="0.01" name="price" value="{{if $b}}{{$b.Price}}{{end}}"
                    class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 tabular-nums">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Notes</label>
            <textarea name="notes" rows="2"
                class="mt-1 block w-full text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">{{if $b}}{{nullString $b.Notes}}{{end}}</textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a href="/bookings" class="px-4 py-2 min-h-[44px] flex items-center justify-center border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-100">Cancel</a>
            <button type="submit" class="px-4 py-2 min-h-[44px] bg-brand-600 text-white rounded-md hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 active:bg-brand-800">Save Booking</button>
        </div>
    </form>
</div>

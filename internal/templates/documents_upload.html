{{define "documents_upload.html"}}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-on-surface tracking-tight">Upload Document</h1>
            <p class="text-sm text-secondary mt-1">Upload verified compliance certificates and documents</p>
        </div>
    </div>

    <div class="bg-surface-container-lowest rounded-xl p-6 border border-border-subtle shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-secondary uppercase mb-1">Document Type</label>
                <input type="text" name="doc_type" placeholder="rc, insurance, puc, fitness, permit, dl, aadhaar, pan" required class="w-full px-3 py-2 border border-border-subtle rounded-lg text-sm bg-surface-container-low text-on-surface">
            </div>

            <div>
                <label class="block text-xs font-semibold text-secondary uppercase mb-1">Expiry Date (optional)</label>
                <input type="date" name="expiry_date" class="w-full px-3 py-2 border border-border-subtle rounded-lg text-sm bg-surface-container-low text-on-surface">
            </div>

            <div>
                <label class="block text-xs font-semibold text-secondary uppercase mb-1">Select File (PDF, JPG, PNG)</label>
                <input type="file" name="file" required class="w-full px-3 py-2 border border-border-subtle rounded-lg text-sm bg-surface-container-low text-on-surface">
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <button type="submit" class="px-5 py-2 bg-primary text-on-primary text-sm font-semibold rounded-lg hover:bg-primary/90 transition shadow-sm">
                    Upload to Vault
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}

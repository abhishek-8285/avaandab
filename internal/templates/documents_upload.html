{{define "documents_upload.html"}}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
            <h1 class="text-xl font-semibold text-on-surface font-display">Upload Document</h1>
            <p class="text-sm text-text-muted mt-0.5">Upload verified compliance certificates and documents</p>
        </div>
    </div>

    <div class="bg-surface-container-lowest rounded-lg p-6 border border-border-subtle shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Document Type</label>
                <input type="text" name="doc_type" placeholder="rc, insurance, puc, fitness, permit, dl, aadhaar, pan" required class="w-full bg-surface-container-low border border-border-subtle rounded-md px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Expiry Date (optional)</label>
                <input type="date" name="expiry_date" class="w-full bg-surface-container-low border border-border-subtle rounded-md px-3 py-2.5 text-sm text-on-surface placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-secondary mb-1.5">Select File (PDF, JPG, PNG)</label>
                <input type="file" name="file" required class="w-full bg-surface-container-low border border-border-subtle rounded-md px-3 py-2.5 text-sm text-on-surface file:mr-3 file:rounded-md file:border-0 file:bg-surface-container-high file:px-3 file:py-1.5 file:text-xs file:font-medium file:text-on-surface cursor-pointer">
            </div>

            <div class="pt-4 flex justify-end gap-3 border-t border-border-subtle">
                <button type="submit" class="inline-flex items-center gap-2 rounded-md bg-primary text-on-primary px-4 py-2 text-sm font-medium hover:bg-primary/90 transition-all cursor-pointer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
                    Upload to Vault
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}

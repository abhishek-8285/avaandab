{{if .KPIs}}
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    {{range .KPIs}}
    <div class="bg-surface-container-lowest rounded-lg border border-border-subtle shadow-sm p-4">
        <p class="text-xs font-semibold uppercase tracking-wider text-text-muted">{{if .Key}}{{t .Key}}{{else}}{{.Label}}{{end}}</p>
        <p class="text-2xl font-bold text-on-surface mt-1 tabular-nums {{.Accent}}">{{.Value}}</p>
        {{if .Sub}}<p class="text-xs text-text-muted mt-0.5">{{.Sub}}</p>{{end}}
    </div>
    {{end}}
</div>
{{end}}

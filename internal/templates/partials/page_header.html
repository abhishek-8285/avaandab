<div class="mb-6 flex flex-col">
  {{if .BackHref}}<div class="mb-2">
    <a href="{{.BackHref}}" class="inline-flex items-center gap-1 text-sm font-medium text-text-muted hover:text-on-surface transition-colors text-decoration-none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><path d="m15 18-6-6 6-6"/></svg>
      {{if .BackLabel}}{{.BackLabel}}{{else}}Back{{end}}
    </a>
  </div>{{end}}
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-xl font-semibold text-on-surface font-display">{{.Title}}</h1>
      {{if .Subtitle}}<p class="text-sm text-text-muted mt-0.5">{{.Subtitle}}</p>{{end}}
    </div>
    {{if .ActionHref}}<a href="{{.ActionHref}}" class="inline-flex items-center gap-2 rounded-md bg-primary text-on-primary px-4 py-2 text-sm font-medium hover:bg-primary/90 transition-all active:scale-[0.98] text-decoration-none">{{if .ActionIcon}}{{icon .ActionIcon}}{{end}}{{.ActionLabel}}</a>{{end}}
  </div>
</div>

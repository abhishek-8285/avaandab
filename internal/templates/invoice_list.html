{{template "page_header.html" (dict "Title" "Invoices" "Subtitle" "Track customer billings, GST breakdown, and payment receipts")}}

<div class="bg-surface-container-lowest border border-border-subtle rounded shadow-sm flex flex-col h-full overflow-hidden">
    <!-- Sticky Filter Bar (Stitch Design) -->
    <form method="GET" action="/invoices" class="px-4 py-2 border-b border-border-subtle flex flex-wrap items-center gap-2 bg-surface-container-lowest sticky top-0 z-10">
        <span class="text-xs font-medium text-secondary mr-2">Filters:</span>
        <a href="/invoices" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .StatusFilter ""}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm">All Invoices</a>
        <a href="/invoices?status=pending" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .StatusFilter "pending"}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm">Pending</a>
        <a href="/invoices?status=paid" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .StatusFilter "paid"}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm font-medium">Paid</a>
        <a href="/invoices?status=partially_paid" class="px-3 py-1 rounded-full border text-xs font-medium transition-colors {{if eq .StatusFilter "partially_paid"}}border-primary bg-primary text-on-primary{{else}}border-border-subtle bg-surface-container-lowest text-secondary hover:bg-surface-container-low{{end}} font-body-sm">Partial</a>

        <div class="ml-auto flex items-center gap-3">
            <div class="relative min-w-[200px]">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" name="q" value="{{.Query}}" placeholder="Search invoice..."
                    class="bg-surface-container-lowest border border-border-subtle rounded py-1.5 pl-9 pr-4 text-sm w-full focus:outline-none focus:border-primary transition-colors">
            </div>
            <button type="submit" class="px-3 py-1 rounded bg-primary text-on-primary text-xs font-medium hover:bg-primary/90 transition-colors">
                Search
            </button>
        </div>
    </form>

    <!-- Data Table Fragment (Datastar refresh target) -->
    <div id="list-table">
        {{template "invoice_list_table.html" .}}
    </div>
</div>

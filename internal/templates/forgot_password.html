<div class="flex-1 flex items-center justify-center p-4 min-h-[calc(100vh-2rem)]">
    <main class="w-full max-w-[420px] my-8">
        <!-- Brand / Logo Area -->
        <div class="mb-4 flex justify-between items-center border-b border-slate-100 pb-3">
            <a href="/" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-[#00685f] transition-colors">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                <span>Back to Home</span>
            </a>
        </div>

        <!-- Forgot Password Card -->
        <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-xs">
            <div class="mb-6 space-y-2 text-center flex flex-col items-center">
                <a href="/" class="inline-flex items-center gap-2.5 no-underline mb-1">
                    <div class="w-10 h-10 rounded-lg bg-[#00685f] text-white flex items-center justify-center shadow-sm shrink-0">
                        <span class="material-symbols-outlined text-2xl">local_shipping</span>
                    </div>
                    <span class="text-2xl font-black text-[#00685f] font-display tracking-tight">Avandab</span>
                </a>
                <h2 class="font-display font-bold text-xl text-slate-900">Forgot Password</h2>
                <p class="text-xs text-slate-500">Enter your registered email address to receive password reset instructions.</p>
            </div>

            {{if .SuccessMsg}}
            <div class="mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-md text-xs space-y-1">
                <div class="font-bold flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-base">check_circle</span>
                    <span>Reset Link Dispatched</span>
                </div>
                <p>{{.SuccessMsg}}</p>
            </div>
            {{end}}

            {{if .Error}}
            <div class="mb-6 p-3.5 bg-red-50 border border-red-200 text-red-700 rounded-md text-xs flex items-center gap-2">
                <span class="material-symbols-outlined text-base shrink-0">error</span>
                <span>{{.Error}}</span>
            </div>
            {{end}}

            <form class="space-y-4" method="POST" action="/forgot-password">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1" for="email">EMAIL ADDRESS</label>
                    <input class="w-full bg-slate-50 border border-slate-300 rounded-md text-sm text-slate-900 py-2.5 px-3 focus:bg-white focus:outline-none focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 transition-all placeholder:text-slate-400" id="email" name="email" placeholder="you@company.com" required type="email"/>
                </div>
                <button class="w-full bg-[#00685f] hover:bg-[#005049] text-white font-bold text-xs uppercase tracking-wider py-3 px-4 rounded-md transition-colors flex items-center justify-center gap-2 cursor-pointer shadow-xs" type="submit">
                    <span>Send Reset Link</span>
                    <span class="material-symbols-outlined text-base">send</span>
                </button>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-slate-100">
                <a class="inline-flex items-center gap-1 text-xs text-slate-500 hover:text-[#00685f] font-bold transition-colors" href="/login">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    <span>Back to Login</span>
                </a>
            </div>
        </div>
    </main>
</div>

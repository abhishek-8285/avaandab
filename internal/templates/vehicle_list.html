<div>
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-900">Vehicles</h2>
        <a href="/vehicles/new" class="px-4 py-2 min-h-[44px] bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">New Vehicle</a>
    </div>

    <form method="GET" action="/vehicles" class="mb-4 flex gap-2">
        <input type="text" name="q" value="{{.Query}}" placeholder="Search vehicles..."
            class="flex-1 text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <select name="status" class="text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <option value="">All Status</option>
            <option value="available" {{if eq .StatusFilter "available"}}selected{{end}}>Available</option>
            <option value="running" {{if eq .StatusFilter "running"}}selected{{end}}>Running</option>
            <option value="maintenance" {{if eq .StatusFilter "maintenance"}}selected{{end}}>Maintenance</option>
            <option value="inactive" {{if eq .StatusFilter "inactive"}}selected{{end}}>Inactive</option>
        </select>
        <button type="submit" class="px-4 py-2 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Filter</button>
    </form>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="th-cell">Reg. Number</th>
                    <th class="th-cell">Vehicle No</th>
                    <th class="th-cell">Type</th>
                    <th class="th-cell">Capacity</th>
                    <th class="th-cell">Fuel</th>
                    <th class="th-cell">Status</th>
                    <th class="th-cell-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Vehicles}}
                <tr>
                    <td class="td-cell">{{.RegistrationNumber}}</td>
                    <td class="td-cell">{{.VehicleNumber}}</td>
                    <td class="td-cell">{{.VehicleType}}</td>
                    <td class="td-cell">{{.Capacity}}</td>
                    <td class="td-cell">{{.FuelType}}</td>
                    <td class="td-cell">
                        <span class="status-badge {{statusBadge .Status}}">{{.Status}}</span>
                    </td>
                    <td class="td-cell-actions">
                        <a href="/vehicles/{{.ID}}" class="action-view">View</a>
                        <a href="/vehicles/{{.ID}}/edit" class="action-edit">Edit</a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

    {{template "pagination.html" .}}
</div>

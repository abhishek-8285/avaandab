<div>
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-900">Users</h2>
        <a href="/users/new" class="px-4 py-2 min-h-[44px] bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">New User</a>
    </div>

    <form method="GET" action="/users" class="mb-4 flex gap-2">
        <input type="text" name="q" value="{{.Query}}" placeholder="Search users..."
            class="flex-1 text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <select name="status" class="text-base border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            <option value="">All Status</option>
            <option value="active" {{if eq .StatusFilter "active"}}selected{{end}}>Active</option>
            <option value="inactive" {{if eq .StatusFilter "inactive"}}selected{{end}}>Inactive</option>
            <option value="suspended" {{if eq .StatusFilter "suspended"}}selected{{end}}>Suspended</option>
        </select>
        <button type="submit" class="px-4 py-2 min-h-[44px] flex items-center justify-center bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 active:bg-gray-300">Filter</button>
    </form>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="th-cell">Name</th>
                    <th class="th-cell">Email</th>
                    <th class="th-cell">Role</th>
                    <th class="th-cell">Status</th>
                    <th class="th-cell-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Users}}
                <tr>
                    <td class="td-cell">{{.Name}}</td>
                    <td class="td-cell">{{.Email}}</td>
                    <td class="td-cell">{{.RoleName}}</td>
                    <td class="td-cell">
                        <span class="status-badge {{statusBadge .Status}}">{{.Status}}</span>
                    </td>
                    <td class="td-cell-actions">
                        <a href="/users/{{.ID}}/edit" class="action-edit">Edit</a>
                        <form method="POST" action="/users/{{.ID}}/delete" class="inline">
                            <button type="submit" class="action-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

    {{template "pagination.html" .}}
</div>

<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="th-cell hidden sm:table-cell">Booking #</th>
                <th class="th-cell">Customer</th>
                <th class="th-cell">Route</th>
                <th class="th-cell">Pickup</th>
                <th class="th-cell">Price</th>
                <th class="th-cell">Status</th>
                <th class="th-cell-right">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
            {{range .Bookings}}
            <tr>
                <td class="td-cell-strong hidden sm:table-cell" data-numeric>{{.BookingNumber}}</td>
                <td class="td-cell">{{.CustomerName}}</td>
                <td class="td-cell">{{.RouteSource}} → {{.RouteDestination}}</td>
                <td class="td-cell">{{datetime .PickupDate}}</td>
                <td class="td-cell-num" data-numeric>{{printf "%.2f" .Price}}</td>
                <td class="td-cell">
                    <span class="status-badge {{statusBadge .Status}}">{{.Status}}</span>
                </td>
                <td class="td-cell-actions">
                    <a href="/bookings/{{.ID}}" class="action-view">View</a>
                    <a href="/bookings/{{.ID}}/edit" class="action-edit">Edit</a>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>

{{template "pagination.html" .}}

<div class="w-full max-w-md">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 auth-enter">
        <div class="p-6 sm:p-8">
            <div class="text-center">
                <h2 class="text-2xl font-extrabold text-slate-900">Change password</h2>
                <p class="mt-2 text-sm text-slate-600">Update your credentials</p>
            </div>

            <form id="change-password-form" class="mt-5 sm:mt-6 space-y-4 sm:space-y-5" method="POST" action="/change-password">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Current password</label>
                    <input type="password" name="old_password" required
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:border-transparent auth-input">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">New password</label>
                    <input type="password" name="new_password" required minlength="8"
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:border-transparent auth-input">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Confirm new password</label>
                    <input type="password" name="confirm_password" required minlength="8"
                        class="block w-full border border-slate-300 rounded-md px-3 py-2 text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:border-transparent auth-input">
                </div>
                <div class="flex items-center justify-between">
                    <a href="/profile" class="text-sm text-blue-600 hover:text-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded">Back to profile</a>
                </div>
                <div>
                    <button type="submit"
                        class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 auth-btn min-h-[44px] disabled:opacity-75 disabled:cursor-not-allowed"
                        data-loading="Saving...">
                        Save password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
(function() {
    var form = document.getElementById('change-password-form');
    if (!form) return;
    var btn = form.querySelector('button[type="submit"]');
    if (!btn) return;
    var loadingText = btn.getAttribute('data-loading');
    if (!loadingText) return;
    form.addEventListener('submit', function() {
        btn.disabled = true;
        btn.innerHTML = loadingText;
    });
})();
</script>

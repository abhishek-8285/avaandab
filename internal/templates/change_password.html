<div class="flex-1 flex items-center justify-center p-4 min-h-[calc(100vh-2rem)]">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl p-8 shadow-sm relative">
        <!-- Top Action Bar -->
        <div class="mb-6 flex items-center justify-between border-b border-slate-100 pb-3">
            <a href="/profile" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-[#00685f] transition-colors">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                <span>Back to Profile</span>
            </a>
        </div>

        <!-- Header -->
        <header class="mb-6 text-center space-y-2">
            <a href="/" class="inline-flex items-center justify-center gap-2.5 no-underline">
                <div class="w-10 h-10 rounded-lg bg-[#00685f] text-white flex items-center justify-center shadow-sm shrink-0">
                    <span class="material-symbols-outlined text-2xl">shield</span>
                </div>
                <span class="text-2xl font-black text-[#00685f] font-display tracking-tight">Avandab</span>
            </a>
            <h2 class="text-lg font-bold text-slate-900 font-display">Change Password</h2>
            <p class="text-xs text-slate-500 font-medium">Update your account credentials safely.</p>
        </header>

        {{if .Error}}
        <div class="mb-6 p-3.5 bg-red-50 border border-red-200 text-red-700 rounded-md text-xs flex items-center gap-2">
            <span class="material-symbols-outlined text-base shrink-0">error</span>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <!-- Form -->
        <form id="change-password-form" class="space-y-4" method="POST" action="/change-password">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1" for="old_password">Current Password *</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
                    <input class="w-full bg-slate-50 border border-slate-300 rounded-md pl-10 pr-3 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 transition-all outline-none" id="old_password" name="old_password" placeholder="••••••••" required type="password"/>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1" for="new_password">New Password *</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">key</span>
                    <input class="w-full bg-slate-50 border border-slate-300 rounded-md pl-10 pr-3 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 transition-all outline-none" id="new_password" name="new_password" placeholder="Minimum 8 characters" minlength="8" required type="password"/>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1" for="confirm_password">Confirm New Password *</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">key</span>
                    <input class="w-full bg-slate-50 border border-slate-300 rounded-md pl-10 pr-3 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-[#00685f] focus:ring-2 focus:ring-[#00685f]/20 transition-all outline-none" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" minlength="8" required type="password"/>
                </div>
            </div>

            <button class="w-full bg-[#00685f] hover:bg-[#005049] text-white font-bold text-xs uppercase tracking-wider py-3 px-4 rounded-md transition-colors flex items-center justify-center gap-2 cursor-pointer shadow-xs mt-2" type="submit">
                <span class="material-symbols-outlined text-base">save</span>
                <span>Save Password</span>
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                Want to manage your account details?
                <a href="/profile" class="text-[#00685f] font-bold hover:underline ml-1">Return to Profile</a>
            </p>
        </div>
    </div>
</div>

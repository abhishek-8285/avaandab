<div class="max-w-4xl mx-auto">
    <div class="bg-surface-container-lowest rounded-lg shadow-sm p-6">
        <h2 class="text-2xl font-bold mb-4 text-on-surface">Revenue Report</h2>

        <div class="mb-6">
            <div class="text-3xl font-bold text-primary">{{printf "%.2f" .TotalRevenue}}</div>
            <div class="text-sm text-secondary">Total Revenue</div>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-border-subtle">
                <thead class="bg-surface-container-low">
                    <tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-text-muted uppercase">Month</th>
                        <th class="px-4 py-2 text-right text-xs font-medium text-text-muted uppercase">Revenue</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-border-subtle">
                    {{range .MonthlyRevenue}}
                    <tr>
                        <td class="px-4 py-2 text-sm">{{.Month}}</td>
                        <td class="px-4 py-2 text-sm text-right">{{printf "%.2f" .Total}}</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="max-w-xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-on-surface">New Maintenance Schedule</h1>
        <p class="text-secondary text-sm">Define odometer or time interval triggers for vehicle servicing.</p>
    </div>

    <form method="POST" action="/maintenance/schedules" class="bg-surface-container-lowest p-6 rounded-xl border border-border-subtle shadow-sm space-y-4">
        <div>
            <label class="block text-sm font-medium text-on-surface mb-1">Vehicle ID *</label>
            <input type="text" name="vehicle_id" value="{{.VehicleID}}" required placeholder="e.g. veh-123"
                   class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
        </div>

        <div>
            <label class="block text-sm font-medium text-on-surface mb-1">Service Type *</label>
            <select name="service_type" required class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                {{range .ServiceTypes}}
                <option value="{{.}}">{{.}}</option>
                {{end}}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Interval (km)</label>
                <input type="number" step="any" name="interval_km" placeholder="e.g. 10000"
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                <span class="text-xs text-secondary">Trigger every N km</span>
            </div>
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Interval (Days)</label>
                <input type="number" name="interval_days" placeholder="e.g. 90"
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                <span class="text-xs text-secondary">Trigger every N days</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 border-t border-border-subtle pt-3">
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Specific Due (km)</label>
                <input type="number" step="any" name="due_km" placeholder="e.g. 50000"
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                <span class="text-xs text-secondary">Fixed odometer milestone</span>
            </div>
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Specific Due Date</label>
                <input type="date" name="due_at"
                       class="w-full px-3 py-2 bg-surface-container-low border border-border-subtle rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                <span class="text-xs text-secondary">Fixed calendar milestone</span>
            </div>
        </div>

        <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" name="active" value="1" checked id="sched_active" class="rounded text-primary focus:ring-primary">
            <label for="sched_active" class="text-sm font-medium text-on-surface">Schedule is Active</label>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-border-subtle">
            <a href="/maintenance" class="px-4 py-2 text-sm text-secondary hover:text-on-surface transition-colors">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-primary text-on-primary rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors shadow-sm">Save Schedule</button>
        </div>
    </form>
</div>

openapi: 3.0.3
info:
  title: MVTMS REST API
  description: |
    OpenAPI specification for the MVTMS REST API v1. Authentication is via
    a signed Bearer token (`Authorization: Bearer <token>`) or an existing
    session cookie. The token endpoints are public; all other `/api/v1/*`
    routes require a valid principal plus Casbin RBAC permissions.
  version: "1.0.0"
  contact:
    name: MVTMS Support
    url: https://avandab.com
servers:
  - url: /
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Public token and registration endpoints.
  - name: Bookings
    description: Booking lifecycle management.
  - name: Trips
    description: Trip planning, assignment, and lifecycle.
  - name: Invoices
    description: Invoice generation and voiding.
  - name: Payments
    description: Payment recording, reversal, and Razorpay webhooks.
  - name: Profit & Loss
    description: Live trip P&L estimates.
  - name: Telemetry
    description: GPS log sync and telemetry snapshots.

paths:
  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Issue API token
      description: Authenticate with email and password to receive a signed Bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Signed token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Public self-registration. Only the `viewer` role can be requested;
        privileged roles must be assigned by an administrator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/errors:
    get:
      tags: [Errors]
      summary: List error report groups
      description: Requires `errors:read` permission. Returns deduplicated error groups (fingerprint + tenant scoped).
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - name: fingerprint
          in: query
          schema: { type: string }
        - name: from
          in: query
          description: RFC3339 or YYYY-MM-DD, filters on last_seen.
          schema: { type: string }
        - name: to
          in: query
          description: RFC3339 or YYYY-MM-DD, filters on last_seen.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Error groups with total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/ErrorReport' }
                  total: { type: integer }
                  limit: { type: string }
                  offset: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/errors/{fingerprint}:
    get:
      tags: [Errors]
      summary: Get one error report group
      description: Requires `errors:read` permission. Powers the /ops/errors detail drawer.
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full error group detail (message, stack trace, metadata, occurrence stats).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorReport' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/errors/incidents:
    get:
      tags: [Errors]
      summary: List incidents
      description: Requires `errors:read` permission.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, ASSIGNED, RESOLVED] }
      responses:
        '200':
          description: Incident list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/errors/incidents/{incidentID}/resolve:
    post:
      tags: [Errors]
      summary: Update an incident
      description: Requires `errors:update` permission. Sets status (OPEN/ASSIGNED/RESOLVED), assignee, and root cause.
      parameters:
        - name: incidentID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, ASSIGNED, RESOLVED] }
                assigned_to: { type: string }
                root_cause: { type: string }
      responses:
        '200':
          description: Incident updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/errors/client:
    post:
      tags: [Errors]
      summary: Report a client-side error
      description: Captures browser errors (message, stack, breadcrumbs, viewport) into the deduplicated error store. Authenticated users get their user id attached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                stack: { type: string }
                path: { type: string }
                user_agent: { type: string }
                viewport: { type: string }
                request_id: { type: string }
                breadcrumbs:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Report stored; returns error_id + correlation_id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  error_id: { type: string }
                  correlation_id: { type: string }

  /api/v1/bookings:
    get:
      tags: [Bookings]
      summary: List bookings
      description: Requires `bookings:read` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/StatusParam'
      responses:
        '200':
          description: Paginated list of bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Bookings]
      summary: Create a booking
      description: Requires `bookings:create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IDResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get a booking
      description: Requires `bookings:read` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Bookings]
      summary: Update a booking
      description: Requires `bookings:update` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Booking updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Bookings]
      summary: Delete a booking
      description: Requires `bookings:delete` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '204':
          description: Booking deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}/confirm:
    post:
      tags: [Bookings]
      summary: Confirm a booking
      description: Requires `bookings:approve` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a booking
      description: Requires `bookings:cancel` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/bookings/{id}/complete:
    post:
      tags: [Bookings]
      summary: Complete a booking
      description: Requires `bookings:update` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: Booking completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/trips:
